虚幻5电影CG。\"\n\n# 段20 ·《集末尾镜》· 次日夜 · 预告片：不加\n\"主体描述\":\"接上一幕的切黑——漆黑荒废的旧神殿深处,那颗死寂多年的黑球上,一道暗红的血迹未干,球体深处亮着一点幽冷的暗金微光,像一只刚刚睁开的眼睛。这点幽光极轻微地、像呼吸/心跳般搏动了一下。镜头缓缓拉远,这点孤独诡异的幽光,沉在亿万里黑暗般的荒废神殿最深处。最后镜头切到神殿之外:后山夜色沉沉,荒废的殿宇剪影孤零零立在月下,一切归于死寂。\"\n\"镜头语言\":\"大特写固定黑球深处的暗金幽光,大特写幽光极轻微搏动一下,缓缓拉远幽光沉在漆黑神殿深处,空镜切到神殿外后山夜色殿宇剪影。克制、留余韵。\"\n\"环境光影\":\"漆黑幽暗,光只来自黑球深处那一点暗金微光,神秘、不祥、克制;结尾神殿外幽蓝月夜、殿宇剪影,死寂。\"\n\"画质修饰\":\"8K超高清,电影级HDR,2D写实国漫,超精细黑球表面质感与血迹、深处一点幽光、荒废神殿与月夜剪影,虚幻5电影CG。\"\n";

  const $ = id => document.getElementById(id);

  function parseSource(text){
    const epM = text.match(/第\s*(\d+)\s*集/);
    if(epM) $('ep').value = epM[1];
    const headRe = /^#+[^\n]*《([^》]+)》[^\n]*$/gm;
    const heads = []; let m;
    while((m = headRe.exec(text))) heads.push({title:m[1].trim(), line:m[0], end:headRe.lastIndex, start:m.index});
    const segs = [];
    for(let i=0;i<heads.length;i++){
      const h = heads[i];
      const block = text.slice(h.end, i+1<heads.length ? heads[i+1].start : text.length);
      const get = k => { const mm = block.match(new RegExp('"'+k+'"\\s*:\\s*"([^"]*)"')); return mm ? mm[1].trim() : ''; };
      const zhuti = get('主体描述');
      if(!zhuti) continue;                 // 没有四字段的(指针/标题)跳过
      const numM = h.line.match(/段\s*(\d+)/);
      const num = numM ? +numM[1] : segs.length+1;
      let time = '';
      const after = (h.line.split('》')[1]||'').split('·').map(s=>s.trim()).filter(Boolean);
      for(const p of after){ if(!/预告片|单地点|类型/.test(p)){ time = p; break; } }
      const scope = h.line + '\n' + block;
      let trailer = '不加';
      if(/不加\s*预告片|预告片\s*[:：]\s*不加/.test(scope)) trailer = '不加';
      else if(/加\s*预告片|预告片\s*[:：]\s*加/.test(scope)) trailer = '加';
      segs.push({num, title:h.title, time, trailer, f:{
        主体描述:zhuti, 镜头语言:get('镜头语言'), 环境光影:get('环境光影'), 画质修饰:get('画质修饰')
      }});
    }
    segs.sort((a,b)=>a.num-b.num);
    return segs;
  }

  function buildPrompt(seg){
    const mode = $('mode').value;
    const inc = mode==='all' ? true : mode==='none' ? false : seg.trailer==='加';
    const head = $('head').value.replace('{预告片}', inc ? '10秒电影预告片。\n' : '');
    const story = '故事 =\n' + ['主体描述','镜头语言','环境光影','画质修饰']
      .filter(k=>seg.f[k]).map(k=>`"${k}":"${seg.f[k]}"`).join('\n');
    return head + '\n\n' + story + '\n\n' + $('neg').value;
  }

  let SEGS = [];
  function render(){
    const ep = $('ep').value.trim() || '1';
    const list = $('list');
    if(!SEGS.length){ list.innerHTML = '<div class="empty">没解析到段。确认 .md 里有「主体描述/镜头语言/环境光影/画质修饰」四字段。</div>'; $('toolbar').style.display='none'; return; }
    $('toolbar').style.display='flex'; $('cnt').textContent = SEGS.length;
    list.innerHTML = '';
    SEGS.forEach((s,idx)=>{
      const prompt = buildPrompt(s);
      const card = document.createElement('div'); card.className='card';
      const pill = s.trailer==='加' ? '<span class="pill add">预告片：加</span>' : '<span class="pill no">一镜到底</span>';
      const incNow = ($('mode').value==='all') || ($('mode').value!=='none' && s.trailer==='加');
      const realPill = $('mode').value==='all' ? '<span class="pill add">预告片：加(全)</span>'
                     : $('mode').value==='none' ? '<span class="pill no">不加(全)</span>' : pill;
      card.innerHTML = `
        <div class="seg-head">
          <span class="seg-no">第${ep}集 · 第${s.num}段</span>
          <span class="seg-title">《${s.title}》</span>
          <span class="seg-meta">${s.time||''}</span>
          ${realPill}
        </div>`;
      const ta = document.createElement('textarea'); ta.className='out'; ta.value = prompt; ta.readOnly = true;
      card.appendChild(ta);
      const act = document.createElement('div'); act.className='seg-actions';
      const cb = document.createElement('button'); cb.className='btn sm'; cb.textContent='复制';
      cb.onclick = ()=> copy(prompt, cb);
      act.appendChild(cb); card.appendChild(act);
      list.appendChild(card);
    });
  }

  function copy(txt, btn){
    const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='✓ 已复制'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent=o; btn.classList.remove('copied');},1200);} };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); }
    else fallback(txt,done);
  }
  function fallback(txt,done){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); done&&done(); }

  function allText(){
    const ep=$('ep').value.trim()||'1';
    return SEGS.map(s=>`【第${ep}集 · 第${s.num}段《${s.title}》】\n${buildPrompt(s)}`).join('\n\n══════════════════\n\n');
  }

  function doParse(){ SEGS = parseSource($('src').value); render(); }

  $('btnDemo').onclick = ()=>{ $('src').value = EMBEDDED; $('fileName').textContent='已载入内置：噬渊第1集20段'; doParse(); };
  $('btnParse').onclick = doParse;
  $('mode').onchange = ()=>{ if(SEGS.length) render(); };
  $('ep').oninput = ()=>{ if(SEGS.length) render(); };
  $('btnAll').onclick = (e)=> copy(allText(), e.target);
  $('btnDl').onclick = ()=>{ const ep=$('ep').value.trim()||'1'; const blob=new Blob([allText()],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`第${ep}集_成品提示词_共${SEGS.length}段.txt`; a.click(); URL.revokeObjectURL(a.href); };
  $('file').onchange = (e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('src').value=r.result; $('fileName').textContent='已上传：'+f.name; doParse(); }; r.readAsText(f,'utf-8'); };
  </script>
</div>
